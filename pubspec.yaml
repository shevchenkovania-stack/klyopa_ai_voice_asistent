name: ai_voice_agent
description: AI Voice Agent - Personal voice assistant for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # Audio & Speech
  record: ^5.2.0
  flutter_tts: ^4.2.0
  edge_tts: ^0.1.5

  # Permissions
  permission_handler: ^11.4.0

  # Contacts & Phone
  flutter_contacts: ^1.1.9+2

  # Alarm & Calendar
  android_alarm_manager_plus: ^4.0.6

  # Utils
  json_annotation: ^4.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/klyopa/
    - assets/klyopa/klepa_parts/

dependency_overrides:
  record_linux:
    path: record_linux_stub
